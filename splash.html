<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenBeats</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        position: absolute;
        inset: 8px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background:
          radial-gradient(120% 140% at 20% 0%, rgba(232, 163, 61, 0.28), transparent 55%),
          radial-gradient(120% 140% at 90% 100%, rgba(88, 116, 255, 0.22), transparent 60%),
          rgba(14, 15, 20, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        animation: rise 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .inner {
        text-align: center;
        animation: fade 700ms ease 120ms both;
      }
      .mark {
        width: 76px;
        height: 76px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: linear-gradient(160deg, #ffd089, #e8a33d 45%, #b8672a);
        box-shadow: 0 10px 30px rgba(232, 163, 61, 0.35);
      }
      .mark svg {
        width: 44px;
        height: 44px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: #f6f3ee;
        font-weight: 650;
      }
      h1 span {
        color: #e8a33d;
      }
      p {
        margin: 6px 0 0;
        font-size: 12px;
        color: rgba(246, 243, 238, 0.62);
      }
      .eq {
        display: flex;
        gap: 4px;
        justify-content: center;
        align-items: flex-end;
        height: 26px;
        margin-top: 20px;
      }
      .eq i {
        display: block;
        width: 4px;
        height: 8px;
        border-radius: 3px;
        background: rgba(232, 163, 61, 0.85);
        animation: bounce 900ms ease-in-out infinite;
      }
      .foot {
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 0 22px;
        font-size: 10px;
        color: rgba(246, 243, 238, 0.4);
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          height: 7px;
          opacity: 0.55;
        }
        50% {
          height: 24px;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="inner">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#231607" stroke-width="1.9" stroke-linecap="round">
            <path d="M4 13v-2a8 8 0 0 1 16 0v2" />
            <rect x="2.5" y="12.5" width="4" height="7" rx="1.6" />
            <rect x="17.5" y="12.5" width="4" height="7" rx="1.6" />
          </svg>
        </div>
        <h1>Open<span>Beats</span></h1>
        <p>Open-source beatmaking studio</p>
        <div class="eq" aria-hidden="true">
          <i style="animation-delay: 0ms"></i>
          <i style="animation-delay: 90ms"></i>
          <i style="animation-delay: 180ms"></i>
          <i style="animation-delay: 270ms"></i>
          <i style="animation-delay: 360ms"></i>
          <i style="animation-delay: 450ms"></i>
          <i style="animation-delay: 540ms"></i>
        </div>
      </div>
      <div class="foot"><span>v__OPENBEATS_VERSION__</span><span>GPL-3.0 · local-first</span></div>
    </div>
  </body>
</html>
