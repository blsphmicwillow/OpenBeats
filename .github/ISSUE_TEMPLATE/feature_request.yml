name: Feature request
description: Suggest a workflow, sound or interface improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the smallest feature that solves it.
        OpenBeats is an original project: do not request copied names, assets or
        DSP from another DAW.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is slow, missing or confusing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should OpenBeats do, and where would it live?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Channel Rack / instruments
        - Piano roll
        - Playlist / arrangement
        - Mixer / effects
        - Browser / sample packs
        - Export / interchange
        - Interface / accessibility
        - Native audio engine
        - Documentation / packaging
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for this request.
          required: true
        - label: This request uses original names and does not ask for another DAW's assets or code.
          required: true
