name: Release

# Build installers on native runners. A v* tag then creates or updates the
# GitHub Release in one job, after every platform build has succeeded.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (deb + RPM + AppImage)
            platform: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: openbeats-linux
            path: |
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
              target/release/bundle/appimage/*.AppImage
          - label: Windows (MSI + NSIS)
            platform: windows-latest
            bundles: msi,nsis
            artifact: openbeats-windows
            path: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - label: macOS (DMG + app, Apple silicon)
            platform: macos-latest
            bundles: dmg,app
            artifact: openbeats-macos
            path: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app.zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs WebKitGTK 4.1, GTK 3 and the audio build headers.
      # These packages are intentionally Ubuntu-only.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        run: |
          set -euo pipefail

          # Canonical's Ubuntu mirrors have runner-wide DNS outages
          # (actions/runner-images#15297). Keep CI package installation on a
          # maintained non-Canonical Ubuntu mirror with bounded retries.
          mirror='https://mirrors.edge.kernel.org/ubuntu'
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i \
              -e "s|https\?://azure\.archive\.ubuntu\.com/ubuntu|${mirror}|g" \
              -e "s|https\?://archive\.ubuntu\.com/ubuntu|${mirror}|g" \
              -e "s|https\?://security\.ubuntu\.com/ubuntu|${mirror}|g" \
              /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i \
              -e "s|https\?://azure\.archive\.ubuntu\.com/ubuntu|${mirror}|g" \
              -e "s|https\?://archive\.ubuntu\.com/ubuntu|${mirror}|g" \
              -e "s|https\?://security\.ubuntu\.com/ubuntu|${mirror}|g" \
              /etc/apt/sources.list
          fi

          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for attempt in 1 2 3; do
            sudo apt-get update "${apt_opts[@]}" || true
            if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "${apt_opts[@]}" \
              libunwind-dev \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev libsoup-3.0-dev libssl-dev patchelf rpm libasound2-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
              gstreamer1.0-pulseaudio gstreamer1.0-alsa; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::Could not install Linux build dependencies after three attempts'
              exit 1
            fi
            sleep 10
          done

          # linuxdeploy-plugin-gtk expects this loader directory to exist.
          sudo mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders

      - name: Install frontend dependencies
        run: npm ci

      - name: Check docs version and relative links
        if: matrix.platform == 'ubuntu-22.04'
        run: node scripts/check-docs.mjs

      # The DSP, sequencer and feature maths are pure Rust and must stay green
      # on every platform in the matrix.
      - name: Native engine tests
        working-directory: src-tauri
        run: cargo test -p openbeats-audio --features device,fundsp-graph,decode,mp3

      # The desktop crate needs GTK/WebKitGTK at link time, so its tests stay on
      # the Linux runner. Windows and macOS still compile it in the build step.
      - name: Desktop crate tests
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo test -p openbeats --lib

      # Linux uses the CLAP-only sidecar; Windows and macOS keep plughost.
      # Both must use the target-triple name Tauri's externalBin expects.
      - name: Stage Linux CLAP helper
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo build --release -p openbeats-clap-helper
          triple="$(rustc -vV | sed -n 's|host: ||p')"
          mkdir -p binaries
          cp "../target/release/openbeats-clap-helper" "binaries/openbeats-clap-helper-${triple}"
          ls -l binaries

      - name: Stage plugin host helper
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo build --release -p openbeats-plughost-helper
          triple="$(rustc -vV | sed -n 's|host: ||p')"
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          mkdir -p binaries
          cp "../target/release/plughost-helper${exe}" "binaries/plughost-helper-${triple}${exe}"
          ls -l binaries

      # Catch bundle-config regressions before spending time on installers.
      - name: Verify installer runtime configuration
        shell: bash
        run: |
          node -e '
          const c = require("./src-tauri/tauri.conf.json");
          const linux = c.bundle?.linux ?? {};
          const deb = linux.deb?.depends ?? [];
          const rpm = linux.rpm?.depends ?? [];
          const win = c.bundle?.windows ?? {};
          const checks = [
            ["bundle.targets must cover every desktop installer",
              c.bundle?.targets === "all"],
            ["bundle.identifier must be reverse-DNS",
              /^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(c.identifier ?? "")],
            ["AppImage must bundle the media framework",
              linux.appimage?.bundleMediaFramework === true],
            ["deb must depend on the GStreamer audio plugins",
              deb.some((d) => d.startsWith("gstreamer1.0-plugins-") || d === "gstreamer1.0-libav")],
            ["deb must depend on a PulseAudio-compatible server",
              deb.some((d) => d.includes("pipewire-pulse") || d.includes("pulseaudio"))],
            ["RPM must depend on the GStreamer audio plugins",
              rpm.some((d) => d.startsWith("gstreamer1-plugins-") || d === "gstreamer1-plugin-libav")],
            ["RPM must depend on a PulseAudio-compatible server",
              rpm.some((d) => d.includes("pipewire-pulse") || d.includes("pulseaudio"))],
            ["Windows installer must use the WebView2 download bootstrapper",
              win.webviewInstallMode?.type === "downloadBootstrapper"],
            ["Windows installer must bundle the VC++ runtime",
              win.bundleVCRuntime === true],
          ];
          let failed = false;
          for (const [name, ok] of checks) {
            console.log(`${ok ? "ok  " : "FAIL"} ${name}`);
            if (!ok) failed = true;
          }
          if (failed) {
            console.error("::error::Installer audio/runtime packaging regressed");
            process.exit(1);
          }
          '

      # macOS signing is optional. The APPLE_* secrets may be empty for local
      # or unsigned CI builds; when set, Tauri signs and notarizes here.
      - name: Build native installers
        shell: bash
        env:
          NO_STRIP: 1
          MACOS_SIGN: ${{ vars.MACOS_SIGN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signing is opt-in: set the MACOS_SIGN repository variable once a
          # valid Developer ID certificate is stored in the APPLE_* secrets.
          if [ "${MACOS_SIGN:-0}" != "1" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npm run desktop:build -- --bundles ${{ matrix.bundles }}

      # A .app is a directory, so zip it for both artifact upload and the
      # GitHub Release. ditto preserves the bundle metadata.
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo '::error::No macOS .app was produced'; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" "${app}.zip"
          ls -lh target/release/bundle/macos

      # Keep the existing Linux audio-runtime proof: the installers must contain
      # the GStreamer plugins and must not bundle a private FUSE runtime.
      - name: Verify bundled Linux audio runtime
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          deb="$(find "$GITHUB_WORKSPACE/target/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$deb" || { echo '::error::No deb was produced'; exit 1; }
          dpkg-deb -f "$deb" Depends | grep -Fq 'gstreamer1.0-pulseaudio'
          dpkg-deb -f "$deb" Depends | grep -Fq 'gstreamer1.0-plugins-good'

          rpm="$(find "$GITHUB_WORKSPACE/target/release/bundle/rpm" -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$rpm" || { echo '::error::No RPM was produced'; exit 1; }
          rpm -qp --requires "$rpm" | grep -Fq 'gstreamer1-plugins-good'

          appimage="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage" || { echo '::error::No AppImage was produced'; exit 1; }
          test -x "$appimage" || { echo '::error::AppImage is not executable'; exit 1; }

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/openbeats || { echo '::error::AppImage has no executable payload'; exit 1; }
          desktop="squashfs-root/usr/share/applications/OpenBeats.desktop"
          test -f "$desktop" || { echo '::error::AppImage has no desktop entry'; exit 1; }
          version="$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').version")"
          deb_version="$(dpkg-deb -f "$deb" Version)"
          test "$deb_version" = "$version" || { echo "::error::deb version ${deb_version} does not match ${version}"; exit 1; }
          grep -q '^Exec=openbeats$' "$desktop" || { echo '::error::AppImage desktop entry has an unexpected Exec'; exit 1; }
          if find squashfs-root -iname 'libfuse*' -print -quit | grep -q .; then
            echo '::error::AppImage must not bundle FUSE; use the host runtime'
            exit 1
          fi

          for plugin in \
            libgstpulseaudio.so libgstalsa.so libgstaudioparsers.so \
            libgstmpg123.so libgstflac.so libgstwavparse.so libgstlibav.so
          do
            if ! find squashfs-root -name "$plugin" -print -quit | grep -q .; then
              echo "::error::AppImage is missing GStreamer plugin $plugin"
              exit 1
            fi
          done
          echo 'AppImage contains the GStreamer audio runtime.'

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach installers to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -printf '%f\n' | sort

      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenBeats ${{ github.ref_name }}
          body: |
            ## OpenBeats ${{ github.ref_name }}

            Native installers for Linux, Windows and macOS, built and tested by
            GitHub Actions on native runners.

            ### Downloads

            - **Linux:** `.deb`, `.rpm`, `.AppImage`
            - **Windows:** `.msi`, NSIS setup `.exe`
            - **macOS:** `.dmg`, zipped `.app`

            ### Verify

            Every asset is listed in `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ### Notes

            - macOS builds are unsigned and not notarised; use Control-click →
              Open on first launch.
            - Linux AppImage: `chmod +x OpenBeats_*_amd64.AppImage`. If your file
              manager reports `InvalidExe`, install FUSE 3 or run with
              `--appimage-extract-and-run`.
            - Playlist audio clips, per-clip effects and pan automation remain
              Web Audio only in 1.0.7; native CPAL audio-clip playback is pending.
            - Linux master volume now reaches the native CPAL engine; no separate
              plugin or audio-group setup is required.

            Full notes: [CHANGELOG.md](https://github.com/blsphmicwillow/OpenBeats/blob/main/CHANGELOG.md).
            Install help: [docs/INSTALL.md](https://github.com/blsphmicwillow/OpenBeats/blob/main/docs/INSTALL.md).
          files: release-assets/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
