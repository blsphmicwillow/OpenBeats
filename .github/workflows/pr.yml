name: PR checks

# The cheap gate for pull requests. Release only runs on main and tags, so a
# Tauri-only break (a Tauri command, config or sidecar wiring) previously reached
# main without the desktop crate ever being compiled on a PR.
on:
  # Every pull request, not only ones targeting main: release work lands on
  # stacked branches and still needs the checks before it reaches main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docs version and relative links
        run: npm run docs:check

  audio:
    name: Audio smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: ubuntu-22.04
          - label: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux audio dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libasound2-dev pulseaudio-utils

      # No device is opened here. This is the check that runs on every platform,
      # including Windows runners, which have no audio endpoint at all.
      - name: Offline render produces audio
        working-directory: src-tauri
        run: cargo run -q -p openbeats-audio --example audio_smoke -- --offline --seconds 2

      # ALSA's `null` PCM exists without any sound server, so this proves the
      # CPAL layer opens a stream and keeps calling back. It cannot prove the
      # audio is audible: the null plugin consumes samples unthrottled.
      - name: Device layer opens and calls back
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: |
          cargo run -q -p openbeats-audio --features device --example audio_smoke \
            -- --device null --seconds 1

      # End-to-end proof that audio reaches PipeWire: headless PipeWire with a
      # null sink, the engine opened through the ALSA bridge, captured from the
      # sink monitor. Best effort for now — GitHub's runner image changes often
      # and this step is diagnostic until it has been green on several runs.
      - name: PipeWire null-sink capture (best effort)
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set -uo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            pipewire wireplumber pipewire-pulse pipewire-alsa
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pipewire > /tmp/pipewire.log 2>&1 &
          sleep 2
          wireplumber > /tmp/wireplumber.log 2>&1 &
          pipewire-pulse > /tmp/pipewire-pulse.log 2>&1 &
          sleep 3
          pactl --version
          pactl info
          pactl load-module module-null-sink sink_name=smoke
          sleep 1
          echo '--- sinks ---'
          pactl list short sinks
          pactl list short sinks | grep -q smoke
          pw-record --target smoke.monitor /tmp/capture.wav > /tmp/pw-record.log 2>&1 &
          recorder=$!
          sleep 1
          # The synth routes through the pulse ALSA PCM into the null sink; this is
          # the same path a desktop PulseAudio/PipeWire machine uses.
          cargo run -q -p openbeats-audio --features device --example audio_smoke \
            -- --device 'PulseAudio|sink:smoke' --seconds 3
          status=$?
          sleep 1
          kill "$recorder" 2>/dev/null || true
          wait "$recorder" 2>/dev/null || true
          ls -l /tmp/capture.wav
          node ../scripts/wav-rms.mjs /tmp/capture.wav 0.001
          exit "$status"

      - name: Upload audio logs
        if: always() && matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: audio-smoke-logs
          path: |
            /tmp/pipewire.log
            /tmp/wireplumber.log
            /tmp/pipewire-pulse.log
            /tmp/pw-record.log
            /tmp/capture.wav
          if-no-files-found: ignore
          retention-days: 7

  desktop:
    name: Desktop crate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: ubuntu-22.04
          - label: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs WebKitGTK 4.1, GTK 3, the appindicator/rsvg dev packages
      # and ALSA headers. Ubuntu-only, exactly as in release.yml.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libunwind-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context! embeds frontendDist, so `dist/` has to exist
      # before anything compiles the desktop crate — even for `cargo check`.
      - name: Build frontend for generate_context
        run: npm run build

      # tauri-build validates bundle.externalBin while compiling the desktop
      # crate, so the platform sidecar must be staged first. A debug build is
      # enough here: only the file's existence and name are checked.
      - name: Stage the plugin sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          triple="$(rustc -vV | sed -n 's|host: ||p')"
          mkdir -p binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build -p openbeats-plughost-helper
            cp "../target/debug/plughost-helper.exe" "binaries/plughost-helper-${triple}.exe"
          else
            cargo build -p openbeats-clap-helper
            cp "../target/debug/openbeats-clap-helper" "binaries/openbeats-clap-helper-${triple}"
          fi
          ls -l binaries

      - name: Native engine tests
        working-directory: src-tauri
        run: cargo test -p openbeats-audio --lib

      # The default feature set is pure DSP. This step is what actually compiles
      # the CPAL device layer, the Linux bridge probe and the stream watchdog.
      - name: Native engine compiles with the device layer
        working-directory: src-tauri
        run: cargo check -p openbeats-audio --features device

      - name: Desktop crate compiles
        working-directory: src-tauri
        run: cargo check -p openbeats --lib
