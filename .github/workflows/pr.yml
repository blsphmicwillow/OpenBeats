name: PR checks

# The cheap gate for pull requests. Release only runs on main and tags, so a
# Tauri-only break (a Tauri command, config or sidecar wiring) previously reached
# main without the desktop crate ever being compiled on a PR.
on:
  # Every pull request, not only ones targeting main: release work lands on
  # stacked branches and still needs the checks before it reaches main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docs version and relative links
        run: npm run docs:check

  audio:
    name: Audio smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: ubuntu-22.04
          - label: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js for WAV capture check
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux audio dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libasound2-dev libasound2-plugins pulseaudio pulseaudio-utils

      # No device is opened here. This is the check that runs on every platform,
      # including Windows runners, which have no audio endpoint at all.
      - name: Offline render produces audio
        working-directory: src-tauri
        run: cargo run -q -p openbeats-audio --example audio_smoke -- --offline --seconds 2

      # This best-effort null-PCM open is diagnostic. The required capture step
      # below verifies enumeration, stream output and the recorded signal.
      # Answers "which bridge package does this image actually have?" from the
      # image itself instead of from memory: jammy has no pipewire-alsa.
      - name: Report the ALSA bridge packages this image offers
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          . /etc/os-release
          echo "image: $PRETTY_NAME ($VERSION_CODENAME)"
          apt-cache policy pipewire-alsa libasound2-plugins pipewire-pulse | sed 's/^/  /'
          echo '--- exact-name search for pipewire-alsa ---'
          apt-cache search --names-only '^pipewire-alsa$' || true

      - name: Device layer compiles against ALSA
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo build -q -p openbeats-audio --features device --example audio_smoke

      - name: Open the ALSA null PCM (diagnostic)
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        working-directory: src-tauri
        run: |
          cargo run -q -p openbeats-audio --features device --example audio_smoke -- --list
          cargo run -q -p openbeats-audio --features device --example audio_smoke \
            -- --device null --seconds 1

      - name: Capture audio through the ALSA Pulse bridge
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/openbeats-pulse-runtime"
          mkdir -p "$XDG_RUNTIME_DIR/pulse"
          chmod 700 "$XDG_RUNTIME_DIR" "$XDG_RUNTIME_DIR/pulse"
          export PULSE_SERVER="unix:$XDG_RUNTIME_DIR/pulse/native"
          capture="$RUNNER_TEMP/openbeats-pulse-capture.wav"
          pulse_log="$RUNNER_TEMP/openbeats-pulseaudio.log"
          capture_log="$RUNNER_TEMP/openbeats-parec.log"
          pulse_pid=
          capture_pid=

          cleanup() {
            if [[ -n "$capture_pid" ]] && kill -0 "$capture_pid" 2>/dev/null; then
              kill -TERM "$capture_pid" 2>/dev/null || true
              wait "$capture_pid" 2>/dev/null || true
            fi
            if [[ -n "$pulse_pid" ]] && kill -0 "$pulse_pid" 2>/dev/null; then
              kill "$pulse_pid" 2>/dev/null || true
              wait "$pulse_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          pulseaudio --daemonize=no --exit-idle-time=-1 --disallow-exit -n \
            --load="module-null-sink sink_name=smoke" \
            --load="module-native-protocol-unix socket=$XDG_RUNTIME_DIR/pulse/native" \
            >"$pulse_log" 2>&1 &
          pulse_pid=$!

          server_ready=false
          for _ in {1..40}; do
            if pactl info >/dev/null 2>&1; then
              server_ready=true
              break
            fi
            if ! kill -0 "$pulse_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [[ "$server_ready" != true ]]; then
            cat "$pulse_log"
            echo "PulseAudio did not become ready" >&2
            exit 1
          fi

          pactl list short sinks | awk '$2 == "smoke" { found=1 } END { exit !found }'
          pactl list short sources | awk '$2 == "smoke.monitor" { found=1 } END { exit !found }'

          timeout --preserve-status --signal=INT --kill-after=5s 8s \
            parec --device=smoke.monitor --file-format=wav "$capture" \
            >"$capture_log" 2>&1 &
          capture_pid=$!

          recorder_ready=false
          for _ in {1..40}; do
            source_outputs="$(pactl list short source-outputs)"
            if [[ -n "$source_outputs" ]]; then
              recorder_ready=true
              break
            fi
            if ! kill -0 "$capture_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [[ "$recorder_ready" != true ]]; then
            cat "$capture_log"
            echo "parec did not connect to the null-sink monitor" >&2
            exit 1
          fi

          device_list="$(cargo run -q -p openbeats-audio --features device --example audio_smoke -- --list)"
          printf '%s\n' "$device_list"
          node -e '
            const result = JSON.parse(process.argv[1]);
            if (!result.outputs.some((name) => /pulse/i.test(name))) {
              console.error("CPAL did not enumerate the ALSA Pulse bridge");
              process.exit(1);
            }
          ' "$device_list"

          probe_output="$(cargo run -q -p openbeats-audio --features device --example audio_smoke \
            -- --device 'PulseAudio|sink:smoke' --seconds 3 | tail -n 1)"
          printf '%s\n' "$probe_output"
          node -e '
            const result = JSON.parse(process.argv[1]);
            if (!/pulse/i.test(result.opened)) {
              console.error(`the engine opened "${result.opened}", not the ALSA Pulse bridge`);
              process.exit(1);
            }
          ' "$probe_output"

          if wait "$capture_pid"; then
            capture_pid=
          else
            status=$?
            capture_pid=
            if [[ "$status" -ne 124 && "$status" -ne 130 ]]; then
              cat "$capture_log"
              exit "$status"
            fi
          fi

          node ../scripts/wav-rms.mjs "$capture" 0.001

  desktop:
    name: Desktop crate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: ubuntu-22.04
          - label: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs WebKitGTK 4.1, GTK 3, the appindicator/rsvg dev packages
      # and ALSA headers. Ubuntu-only, exactly as in release.yml.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libunwind-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context! embeds frontendDist, so `dist/` has to exist
      # before anything compiles the desktop crate — even for `cargo check`.
      - name: Build frontend for generate_context
        run: npm run build

      # tauri-build validates bundle.externalBin while compiling the desktop
      # crate, so the platform sidecar must be staged first. A debug build is
      # enough here: only the file's existence and name are checked.
      - name: Stage the plugin sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          triple="$(rustc -vV | sed -n 's|host: ||p')"
          mkdir -p binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build -p openbeats-plughost-helper
            cp "../target/debug/plughost-helper.exe" "binaries/plughost-helper-${triple}.exe"
          else
            cargo build -p openbeats-clap-helper
            cp "../target/debug/openbeats-clap-helper" "binaries/openbeats-clap-helper-${triple}"
          fi
          ls -l binaries

      - name: Native engine tests
        working-directory: src-tauri
        run: cargo test -p openbeats-audio --lib

      # The default feature set is pure DSP. This step is what actually compiles
      # the CPAL device layer, the Linux bridge probe and the stream watchdog.
      - name: Native engine compiles with the device layer
        working-directory: src-tauri
        run: cargo check -p openbeats-audio --features device

      - name: Desktop crate compiles
        working-directory: src-tauri
        run: cargo check -p openbeats --lib
