name: PR checks

# The cheap gate for pull requests. Release only runs on main and tags, so a
# Tauri-only break (a Tauri command, config or sidecar wiring) previously reached
# main without the desktop crate ever being compiled on a PR.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docs version and relative links
        run: npm run docs:check

  desktop:
    name: Desktop crate (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            platform: ubuntu-22.04
          - label: Windows
            platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 needs WebKitGTK 4.1, GTK 3, the appindicator/rsvg dev packages
      # and ALSA headers. Ubuntu-only, exactly as in release.yml.
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libunwind-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install frontend dependencies
        run: npm ci

      # tauri::generate_context! embeds frontendDist, so `dist/` has to exist
      # before anything compiles the desktop crate — even for `cargo check`.
      - name: Build frontend for generate_context
        run: npm run build

      # tauri-build validates bundle.externalBin while compiling the desktop
      # crate, so the platform sidecar must be staged first. A debug build is
      # enough here: only the file's existence and name are checked.
      - name: Stage the plugin sidecar
        shell: bash
        run: |
          set -euo pipefail
          cd src-tauri
          triple="$(rustc -vV | sed -n 's|host: ||p')"
          mkdir -p binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo build -p openbeats-plughost-helper
            cp "../target/debug/plughost-helper.exe" "binaries/plughost-helper-${triple}.exe"
          else
            cargo build -p openbeats-clap-helper
            cp "../target/debug/openbeats-clap-helper" "binaries/openbeats-clap-helper-${triple}"
          fi
          ls -l binaries

      - name: Native engine tests
        working-directory: src-tauri
        run: cargo test -p openbeats-audio --lib

      # The default feature set is pure DSP. This step is what actually compiles
      # the CPAL device layer, the Linux bridge probe and the stream watchdog.
      - name: Native engine compiles with the device layer
        working-directory: src-tauri
        run: cargo check -p openbeats-audio --features device

      - name: Desktop crate compiles
        working-directory: src-tauri
        run: cargo check -p openbeats --lib
