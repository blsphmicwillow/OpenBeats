[package]
name = "openbeats"
version = "1.0.7"
description = "OpenBeats — open-source beatmaking studio"
authors = ["OpenBeats"]
edition = "2021"
rust-version = "1.92"

# Workspace membership and [profile.release] live in the root Cargo.toml.

[lib]
name = "openbeats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# PCM WAV writing for recorded input takes.
hound = "3.5"
discord-rich-presence = "0.2.5"
# Suggestions webhook and GitHub release checks.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Sample-pack import (.zip).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Native audio engine: CPAL device layer + fundsp graph.
openbeats-audio = { path = "crates/openbeats-audio", features = ["device", "fundsp-graph", "decode", "mp3"] }
# VST3 / CLAP hosting, isolated in the plughost helper process.
openbeats-plugins = { path = "crates/openbeats-plugins" }
