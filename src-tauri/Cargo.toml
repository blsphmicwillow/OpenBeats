[package]
name = "openbeats"
version = "1.0.0"
description = "OpenBeats — open-source beatmaking studio"
authors = ["OpenBeats"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openbeats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
discord-rich-presence = "0.2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
