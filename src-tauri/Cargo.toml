[package]
name = "openbeats"
version = "1.0.1"
description = "OpenBeats — open-source beatmaking studio"
authors = ["OpenBeats"]
edition = "2021"
rust-version = "1.92"

[workspace]
members = [".", "crates/openbeats-audio", "crates/openbeats-plugins", "plughost-helper"]
resolver = "2"

[lib]
name = "openbeats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
discord-rich-presence = "0.2.5"
# Suggestions webhook and GitHub release checks.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Sample-pack import (.zip).
zip = { version = "2", default-features = false, features = ["deflate"] }

# Native audio engine: CPAL device layer + fundsp graph.
openbeats-audio = { path = "crates/openbeats-audio", features = ["device", "fundsp-graph", "decode"] }
# VST3 / CLAP hosting, isolated in the plughost helper process.
openbeats-plugins = { path = "crates/openbeats-plugins" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
