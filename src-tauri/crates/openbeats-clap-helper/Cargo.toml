[package]
name = "openbeats-clap-helper"
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
description = "Linux-only out-of-process CLAP host for OpenBeats"
license = "GPL-3.0-or-later"

[[bin]]
name = "openbeats-clap-helper"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
clack-extensions = { version = "0.2", features = ["clack-host", "gui", "timer"] }
clack-host = "0.2"
clap-sys = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
