[package]
name = "openbeats-audio"
version = "1.0.0"
edition = "2021"
rust-version = "1.92"
description = "OpenBeats native audio engine: DSP, sequencer, synth voices and the CPAL device layer"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.15", optional = true }
fundsp = { version = "0.20", optional = true }

[features]
# Pure DSP + sequencing: builds and tests on any machine, no system libraries.
default = []
# The CPAL device layer. Needs an audio backend (ALSA headers on Linux).
device = ["dep:cpal"]
# fundsp-backed oscillator graph for the test tone and the master glue.
fundsp-graph = ["dep:fundsp"]
