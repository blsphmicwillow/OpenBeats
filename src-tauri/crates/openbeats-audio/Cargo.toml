[package]
name = "openbeats-audio"
version = "1.0.1"
edition = "2021"
rust-version = "1.92"
description = "OpenBeats native audio engine: DSP, sequencer, synth voices and the CPAL device layer"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.15", optional = true }
fundsp = { version = "0.20", optional = true }
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "mp3",
    "flac",
    "vorbis",
    "ogg",
    "wav",
    "isomp4",
    "aac",
    "pcm",
] }
# Real FFT for the spectrum display and the spectral freeze.
rustfft = "6"
# Pure-Rust FLAC encoder used by the export dialog.
flacenc = "0.5"

[features]
# Pure DSP + sequencing: builds and tests on any machine, no system libraries.
default = []
# The CPAL device layer. Needs an audio backend (ALSA headers on Linux).
device = ["dep:cpal"]
# Decoding for the sample preview, pack import and audio-to-note input.
decode = ["dep:symphonia"]
# fundsp-backed oscillator graph for the test tone and the master glue.
fundsp-graph = ["dep:fundsp"]
